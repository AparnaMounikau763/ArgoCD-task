apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argocd-task
  template:
    metadata:
      labels:
        app: argocd-task
    spec:
      containers:
      - name: argocd-task
        image: 621533607727.dkr.ecr.us-west-1.amazonaws.com/argocd-task:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-task-service
spec:
  type: NodePort
  selector:
    app: argocd-task
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007